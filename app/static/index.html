<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>qBit Lite</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0d0f13; --panel:#15181e; --panel2:#1c2028; --line:#272c36; --text:#e9ecf2; --muted:#8a92a3;
  --accent:#2fa4ff; --accent2:#7cc6ff; --dl:#2fa4ff; --up:#3ecf8e; --warn:#f5b84b; --bad:#ff6b6b; --stop:#8a92a3;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input[type=text],input[type=password],input[type=search],textarea,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:84px;font-size:13.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
svg.i{width:18px;height:18px;flex:none}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:#0d0f13ee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(10px + var(--safe-t)) 16px 10px}
.top .row{display:flex;align-items:center;gap:10px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:17px;flex:1;min-width:0}
.brand img{width:28px;height:28px;border-radius:8px}
.speeds{display:flex;gap:12px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.speeds span{display:flex;align-items:center;gap:4px}
.speeds .d{color:var(--dl)} .speeds .u{color:var(--up)}
.iconbtn{background:none;border:0;color:var(--muted);padding:8px;border-radius:10px;display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--panel2);color:var(--text)}
.iconbtn.on{color:var(--warn);background:#f5b84b1a}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:650;background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{background:var(--line);color:var(--muted);cursor:default;filter:none}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.btn.danger{background:#ff6b6b1f;color:var(--bad);border:1px solid #ff6b6b40}
.btn.sm{padding:8px 13px;font-size:13.5px;border-radius:10px}

/* toolbar */
.wrap{max-width:1400px;margin:0 auto;padding:12px 16px calc(100px + var(--safe-b))}
.filters{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -16px;padding-left:16px;padding-right:16px}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 13px;font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.chip b{font-weight:650;color:var(--text);font-size:12px;background:var(--panel2);border-radius:10px;padding:0 6px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on b{background:#ffffff30;color:#fff}
.searchrow{display:flex;gap:10px;margin:12px 0 10px;align-items:center}
.searchrow input{flex:1}
.searchrow select{width:auto;flex:none}
.meta{color:var(--muted);font-size:12.5px;margin:0 2px 8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* cards (mobile) */
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.card:active{background:var(--panel2)}
.card .n{font-weight:600;font-size:14.5px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .l1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .l2{display:flex;gap:12px;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--panel2);border-radius:5px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--dl);transition:width .5s}
.st-seed .bar>i{background:var(--up)} .st-stop .bar>i{background:var(--stop)} .st-err .bar>i{background:var(--bad)} .st-wait .bar>i{background:var(--warn)}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.3px;flex:none;white-space:nowrap}
.pill.st-dl{background:#2fa4ff22;color:var(--dl)} .pill.st-seed{background:#3ecf8e22;color:var(--up)}
.pill.st-stop{background:#8a92a322;color:var(--muted)} .pill.st-err{background:#ff6b6b22;color:var(--bad)} .pill.st-wait{background:#f5b84b22;color:var(--warn)}
.pill.st-move{background:#b78cff26;color:#c7a6ff}
.st-move .bar>i{background:#b78cff}
.bar>i.indet{background:linear-gradient(90deg,transparent,#b78cff,transparent);background-size:50% 100%;background-repeat:no-repeat;animation:indet 1.2s linear infinite}
@keyframes indet{from{background-position:-50% 0}to{background-position:150% 0}}
.dl{color:var(--dl)} .up{color:var(--up)}

/* table (desktop) */
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;display:none}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:57px;background:var(--bg)}
th.r,td.r{text-align:right}
th .arr{opacity:.8;margin-left:3px}
td{padding:9px 10px;border-bottom:1px solid #1d2129;white-space:nowrap}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--panel)}
td.name{white-space:normal;min-width:260px;max-width:560px;font-weight:550;word-break:break-word}
td.prog{min-width:130px}
td.prog .bar{margin-top:0;display:inline-block;width:80px;vertical-align:middle;margin-right:8px}
td.path{color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);text-align:center;padding:50px 20px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}

@media (min-width:980px){
  table{display:table} .list{display:none}
  .fab{display:none !important}
}
@media (max-width:979px){ .addtop{display:none !important} .speeds .lbl{display:none} }
@media (max-width:420px){ .brand span{display:none} }

/* floating add button (mobile) */
.fab{position:fixed;right:18px;bottom:calc(20px + var(--safe-b));z-index:25;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:#fff;box-shadow:0 10px 30px #2fa4ff55;display:grid;place-items:center}
.fab svg{width:26px;height:26px}

/* sheets */
.ov{position:fixed;inset:0;background:#04050799;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.ov.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(600px,100%);max-height:min(90vh,920px);display:flex;flex-direction:column;box-shadow:0 30px 80px #000a}
.sheet header{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet header h2{margin:0;font-size:17px;word-break:break-word}
.sheet .body{overflow:auto;padding:16px 18px}
.sheet footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px calc(14px + var(--safe-b));border-top:1px solid var(--line);flex-wrap:wrap}
@media (max-width:640px){
  .ov{padding:0;align-items:flex-end}
  .sheet{width:100%;border-radius:18px 18px 0 0;max-height:92dvh}
}
.field{margin-bottom:16px}
.field>label.l{display:block;font-weight:600;font-size:14px;margin-bottom:7px}
.hint{color:var(--muted);font-size:12.5px;margin-top:6px}
.tree{border:1px solid var(--line);border-radius:11px;background:var(--bg);max-height:300px;overflow:auto;margin-top:8px;padding:4px;overscroll-behavior:contain}
.tnode{display:flex;align-items:center;border-radius:8px}
.tnode:hover{background:var(--panel2)}
.tnode.sel{background:#2fa4ff24}
.tnode.sel .tname{color:var(--text);font-weight:600}
.tnode.sel .tname svg{color:var(--accent)}
.tchev{background:none;border:0;width:32px;height:36px;display:grid;place-items:center;color:var(--muted);flex:none;padding:0}
.tchev svg{transition:transform .15s;width:14px;height:14px}
.tchev.open svg{transform:rotate(90deg)}
.tchev.leaf{visibility:hidden}
.tname{flex:1;min-width:0;background:none;border:0;text-align:left;padding:8px 6px 8px 0;display:flex;gap:8px;align-items:center;color:#c3c9d5;font-size:14px}
.tname svg{width:17px;height:17px;flex:none;color:#6b7385}
.tname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tload{color:var(--muted);font-size:12.5px;padding:7px 0}
.pathhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.pathhead label{font-weight:600;font-size:14px}
.linkbtn{background:none;border:0;color:var(--accent2);font-size:13px;padding:4px 2px}
.selpath{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.browser{border:1px solid var(--line);border-radius:13px;background:var(--bg);overflow:hidden}
.savehere{display:flex;align-items:center;gap:9px;padding:11px 13px;background:#2fa4ff18;border-bottom:1px solid var(--line);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--text)}
.savehere svg{color:var(--accent);flex:none}
.savehere span{word-break:break-all}
.crumbs{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted);flex:none}
.crumbs button:last-child{color:var(--text);border-color:var(--accent)}
.crumbs .sep{color:var(--muted);padding:0 2px}
.dirs{max-height:min(46vh,380px);overflow-y:auto;overscroll-behavior:contain}
.dir{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 14px;background:none;border:0;border-bottom:1px solid #1c2028;text-align:left;font-size:15px;color:var(--text)}
.dir:active{background:var(--panel2)}
@media (hover:hover){ .dir:hover{background:var(--panel2)} }
.dir span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dir .fold{color:#6b7385;width:20px;height:20px}
.dir .chev{color:var(--muted);width:14px;height:14px}
.dir.up{color:var(--accent2);font-weight:600}
.dirmsg{color:var(--muted);font-size:13.5px;padding:16px 14px}
.newdir{width:100%;background:none;border:0;border-top:1px solid var(--line);padding:13px;color:var(--accent2);font-size:14px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pchip{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:5px 10px;font-size:12.5px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip:hover,.pchip.on{color:var(--text);border-color:var(--accent)}
.rowtoggle{display:flex;justify-content:space-between;align-items:center;gap:14px}
.toggle{display:flex;align-items:center;cursor:pointer}
.toggle input{display:none}
.sw{position:relative;width:38px;height:22px;border-radius:22px;background:var(--line);transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
input:checked+.sw{background:var(--accent)}
input:checked+.sw::after{left:18px}
.drop{display:block;border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:13.5px;cursor:pointer}
.drop.has{border-color:var(--accent);color:var(--text)}
.dropov{position:fixed;inset:0;z-index:95;display:none;place-items:center;background:#0d0f13cc;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none}
.dropov.show{display:grid}
.draghint{font-size:12px}
@media (hover:none){.draghint{display:none}}
.dropov>div{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 56px;border:2px dashed var(--accent);border-radius:20px;background:#2fa4ff12;color:var(--text,#e8ebf1);font-size:16px}
.dropov .i{width:34px;height:34px;color:var(--accent)}
.drop{position:relative}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13.5px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-all}
.kv dd .muted{color:var(--muted);font-size:12.5px} .kv dd code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.dtabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;margin:16px 0 14px}
.dtabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:600}
.dtabs button.on{background:var(--panel2);color:var(--text)}
.dtabs b{font-size:11.5px;background:var(--panel2);border-radius:9px;padding:1px 6px;margin-left:4px;color:var(--muted)}
.dtabs button.on b{background:var(--line);color:var(--text)}
.peers{display:flex;flex-direction:column;gap:6px}
.peer{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:13px;font-variant-numeric:tabular-nums}
.peer .pl1{display:flex;align-items:center;gap:8px}
.peer .flag{font-size:16px;line-height:1}
.peer .addr{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peer .conn{color:var(--muted);font-size:11px;font-weight:700}
.peer .pl2{display:flex;justify-content:space-between;gap:8px;color:var(--muted);margin-top:3px;font-size:12.5px}
.peer .client{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peer .flags{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;flex:none}
.peer .pl3{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12px;color:var(--muted)}
.peer .pl3 .bar{flex:1;margin:0;height:4px}
.spinner{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.busy{background:#f5b84b14;border:1px solid #f5b84b55;color:var(--text,#e8ebf1);border-radius:12px;padding:10px 14px;margin:0 0 10px;font-size:13px;line-height:1.45}
.busy b{color:var(--warn)}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,-120px);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;transition:transform .3s;z-index:90;max-width:90vw;box-shadow:0 10px 30px #0008}
.toast.show{transform:translate(-50%,0)}
.toast.bad{border-color:var(--bad)}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login form{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px}
.login h1{margin:0 0 4px;font-size:22px;display:flex;align-items:center;gap:10px}
.login p{color:var(--muted);margin:0 0 20px;font-size:13.5px}
.login .field input{margin-top:0}

/* first-run setup */
.setup{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + var(--safe-b))}
.wiz{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 24px;box-shadow:0 30px 80px #0006}
.wiz .logo{display:flex;align-items:center;gap:10px;font-weight:750;font-size:15px;color:var(--muted);margin-bottom:18px}
.wiz .logo img{width:26px;height:26px;border-radius:7px}
.wiz h1{margin:0 0 6px;font-size:22px;letter-spacing:-.2px}
.wiz p.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.wiz .nav{display:flex;gap:10px;margin-top:22px}
.wiz .nav .btn{flex:1}
.wiz .nav .btn.ghost{flex:0 0 auto}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;cursor:pointer;background:var(--bg)}
.opt.on{border-color:var(--accent);background:#2fa4ff12}
.opt input{margin:3px 0 0;accent-color:var(--accent);width:17px;height:17px;flex:none}
.opt b{display:block;font-size:14.5px}
.opt span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.opt code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--text,#e8ebf1)}
.opt .tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--up);background:#3ecf8e1f;border-radius:10px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.ok{display:flex;gap:10px;align-items:center;background:#3ecf8e14;border:1px solid #3ecf8e40;color:var(--up);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:16px}
.errbox{background:#ff6b6b14;border:1px solid #ff6b6b40;color:#ffb0b0;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:14px;line-height:1.5}
.tips{color:var(--muted);font-size:12.5px;margin:10px 0 0;padding-left:18px;line-height:1.6}
.tips code,.wiz code,.kv code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--panel2);border-radius:5px;padding:1px 5px;color:var(--text)}
details.adv{margin-top:6px;font-size:13px;color:var(--muted)}
details.adv summary{cursor:pointer;padding:4px 0}
details.adv input{margin-top:8px}
.sect{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 0 10px;font-weight:700}
.lim{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lim label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.lim input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;outline:none}
.lim input:focus{border-color:var(--accent)}
.iconbtn.auto{position:relative}
.iconbtn.auto::after{content:"A";position:absolute;right:2px;bottom:2px;font-size:8.5px;font-weight:800;line-height:1;background:var(--panel2);color:var(--muted);border-radius:4px;padding:1px 2px}
.scan{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:14px;margin-bottom:10px}
.scan .spinner{margin:0;width:20px;height:20px;border-width:2.5px}
.bigcheck{width:56px;height:56px;border-radius:50%;background:#3ecf8e22;color:var(--up);display:grid;place-items:center;margin:4px 0 16px}
.bigcheck svg{width:28px;height:28px}
.err{color:var(--bad);font-size:13px;margin-bottom:12px;min-height:18px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">

<div class="toast" id="toast"></div>

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const jsq = s => String(s ?? "").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function size(b){ if(b==null||b<0) return "–"; const u=["B","KB","MB","GB","TB"]; let i=0; while(b>=1024&&i<u.length-1){b/=1024;i++;} return (i<2?b.toFixed(0):b.toFixed(b<10?2:1))+" "+u[i]; }
const speed = b => b>0 ? size(b)+"/s" : "–";
function eta(s){ if(s==null||s<0||s>=8640000) return "∞"; if(s<60) return s+"s"; if(s<3600) return Math.floor(s/60)+"m "+(s%60)+"s"; if(s<86400) return Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m"; return Math.floor(s/86400)+"d "+Math.floor(s%86400/3600)+"h"; }
/* Where a torrent downloads: through the incomplete folder (qBittorrent's
   download_path) or straight to the save path, and where its files are now. */
function dlRoute(t){
  const inc=(t.download_path||"").replace(/\/+$/,"");
  if(!inc) return `<b>Directly to the save path</b>`;
  const there = t.content_path && (t.content_path===inc || t.content_path.startsWith(inc+"/"));
  let now;
  if(t.state==="moving") now = `Moving to ${esc(t.save_path)} now`;
  else if(t.progress<1) now = `Downloading here; moved to the save path when finished`;
  else if(there) now = `Finished, files still in the incomplete folder`;
  else now = `Finished and moved to the save path`;
  return `<b>Incomplete folder first</b> · <code>${esc(inc)}</code><br><span class="muted">${now}</span>`;
}
function ago(ts){ if(!ts||ts<0) return "–"; return new Date(ts*1000).toLocaleString(); }
function toast(msg, bad){ const t=$("#toast"); t.textContent=msg; t.className="toast show"+(bad?" bad":""); clearTimeout(t._h); t._h=setTimeout(()=>t.className="toast",3000); }

class AuthError extends Error {}
async function q(path, opts={}){
  const r = await fetch("/api/v2/"+path, {credentials:"same-origin", ...opts});
  if(r.status===403){ throw new AuthError("forbidden"); }
  if(!r.ok){ const e=new Error((await r.text()) || r.statusText); e.status=r.status; throw e; }
  const ct = r.headers.get("content-type")||"";
  return ct.includes("json") ? r.json() : r.text();
}
const form = obj => { const f=new URLSearchParams(); for(const k in obj) f.append(k,obj[k]); return {method:"POST",body:f}; };

/* ============ state ============ */
const S = {
  cfg:null, torrents:{}, server:{}, categories:{}, rid:0, prefs:null, api:"2.11",
  filter: localStorage.getItem("ql.filter")||"all", search:"",
  sort: localStorage.getItem("ql.sort")||"added_on", desc: localStorage.getItem("ql.desc")!=="0",
  detail:null, timer:null, detTab:"info", peers:null, peerTimer:null,
};
const FILTERS = [["all","All"],["downloading","Downloading"],["seeding","Seeding"],["stopped","Stopped"],["completed","Completed"],["active","Active"],["errored","Errors"]];
const SORTS = [["added_on","Added"],["name","Name"],["size","Size"],["progress","Progress"],["dlspeed","Down speed"],["upspeed","Up speed"],["eta","ETA"],["ratio","Ratio"],["num_seeds","Seeds"]];

function stInfo(t){
  const s=t.state;
  const map = {
    downloading:["Downloading","st-dl"], forcedDL:["Downloading (F)","st-dl"], metaDL:["Fetching metadata","st-dl"], forcedMetaDL:["Fetching metadata","st-dl"],
    stalledDL:["Stalled","st-wait"], queuedDL:["Queued","st-wait"], checkingDL:["Checking","st-wait"], allocating:["Allocating","st-wait"],
    uploading:["Seeding","st-seed"], forcedUP:["Seeding (F)","st-seed"], stalledUP:["Seeding","st-seed"], queuedUP:["Queued","st-wait"], checkingUP:["Checking","st-wait"],
    stoppedDL:["Stopped","st-stop"], pausedDL:["Stopped","st-stop"], stoppedUP:["Completed","st-stop"], pausedUP:["Completed","st-stop"],
    checkingResumeData:["Checking","st-wait"], moving:["Moving","st-wait"], error:["Error","st-err"], missingFiles:["Missing files","st-err"],
  };
  return map[s] || [s||"Unknown","st-wait"];
}
const isStopped = t => /^(stopped|paused)/.test(t.state);
function matches(t,f){
  switch(f){
    case "downloading": return /DL$|^downloading$|^allocating$/.test(t.state) && !isStopped(t);
    case "seeding": return /^(uploading|forcedUP|stalledUP|queuedUP)$/.test(t.state);
    case "stopped": return isStopped(t);
    case "completed": return t.progress>=1;
    case "active": return t.dlspeed>0 || t.upspeed>0;
    case "errored": return t.state==="error"||t.state==="missingFiles";
    default: return true;
  }
}

/* ============ boot / auth ============ */
async function boot(){
  clearTimeout(S.timer);
  S.cfg = await fetch("/lite/config").then(r=>r.json()).catch(()=>({configured:true}));
  if(!S.cfg.configured) return startSetup();
  try{
    S.api = await q("app/webapiVersion");
    S.prefs = await q("app/preferences");
    S.auto = await fetch("/lite/automation").then(r=>r.json()).catch(()=>null);
    renderShell(); poll();
  }catch(e){
    if(e instanceof AuthError){
      if(S.cfg.mode==="login") return renderLogin("");
      return renderProblem(S.cfg.mode==="bypass"
        ? "qBittorrent asked for a login. Its whitelist for qBit Lite's network may have been removed or changed."
        : "qBittorrent rejected the saved account. The username or password may have changed.");
    }
    if(e.status===504){
      renderProblem(e.message+" It may be busy, for example copying a large move between disks. Retrying every 10 seconds; there's no need to run the setup again.");
      S.timer = setTimeout(boot, 10000);
      return;
    }
    renderProblem("Can't reach qBittorrent at "+(S.cfg.url||"")+". "+e.message);
  }
}
function renderProblem(msg){
  clearTimeout(S.timer);
  $("#app").innerHTML = `<div class="setup"><div class="wiz">
    <div class="logo"><img src="icon.svg" alt="">qBit Lite</div>
    <h1>Can't connect</h1>
    <div class="errbox" style="margin:10px 0 0">${esc(msg)}</div>
    <div class="nav"><button class="btn ghost" onclick="boot()">Retry</button>
    ${S.cfg.env?"":`<button class="btn" onclick="rerunSetup(true)">Run setup again</button>`}</div>
    ${S.cfg.env?`<p class="hint">This connection is configured with environment variables (QBIT_URL…). Fix them and restart the container.</p>`:""}
  </div></div>`;
}
function renderLogin(msg){
  clearTimeout(S.timer);
  $("#app").innerHTML = `<div class="login"><form onsubmit="doLogin(event)">
    <h1><img src="icon.svg" width="30" height="30" style="border-radius:8px">qBit Lite</h1>
    <p>Sign in with your qBittorrent WebUI account.</p>
    <div class="err" id="lerr">${esc(msg||"")}</div>
    <div class="field"><label class="l">Username</label><input type="text" id="lu" autocomplete="username" autocapitalize="off" required></div>
    <div class="field"><label class="l">Password</label><input type="password" id="lp" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%" id="lgo">Sign in</button>
  </form></div>`;
}
async function doLogin(ev){
  ev.preventDefault();
  $("#lgo").disabled=true; $("#lerr").textContent="";
  try{
    const r = await fetch("/api/v2/auth/login", {method:"POST", body:new URLSearchParams({username:$("#lu").value, password:$("#lp").value})});
    const txt = (await r.text()).trim();
    if(r.ok && (txt==="Ok." || txt==="")) return boot();
    $("#lerr").textContent = r.status===429 ? txt : r.status===403 ? "Too many failed attempts: qBittorrent has temporarily blocked logins." : "Wrong username or password.";
  }catch(e){ $("#lerr").textContent = e.message; }
  $("#lgo").disabled=false;
}
async function logout(){ try{ await q("auth/logout",{method:"POST"}); }catch(e){} S.torrents={}; S.rid=0; renderLogin(""); }

/* ============ first-run setup ============ */
const W = {};
function startSetup(){
  clearTimeout(S.timer);
  Object.assign(W, {step:1, url:W.url||S.cfg.suggested_url||"http://host.docker.internal:8080", open:false, version:"",
    subnet:"", user:"", pass:"", mode:"bypass", err:"", busy:false, found:null, manual:false});
  renderSetup(); scanQbit();
}
async function scanQbit(){
  W.found=null; W.err=""; if(W.step===1) renderSetup();
  const r = await setupCall("discover", {}).catch(()=>({ok:false}));
  W.found = r.ok ? r.found : [];
  if(W.found.length && !W.manual) W.url = W.found[0].url;
  if(!W.found.length) W.manual = true;
  if(W.step===1) renderSetup();
}
function pickFound(u){ W.url=u; W.manual=false; W.err=""; renderSetup(); }
async function setupCall(step, body){
  const r = await fetch("/lite/setup/"+step, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  return r.json().catch(()=>({ok:false, error:"Unexpected answer from qBit Lite ("+r.status+")"}));
}
function renderSetup(){
  const n = W.open ? 2 : 3, at = W.step===1?1 : W.step===2?2 : W.step===3?(W.open?2:3) : n+1;
  const dots = `<div class="steps">${Array.from({length:n},(_,i)=>`<i class="${i<at?"on":""}"></i>`).join("")}</div>`;
  const err = W.err ? `<div class="errbox">${esc(W.err)}</div>` : "";
  const busy = W.busy ? "disabled" : "";
  let body = "";
  if(W.step===1) body = `
    <h1>Connect to qBittorrent</h1>
    <p class="sub">${W.found===null?"Looking for qBittorrent on this server and your network…"
      : W.found.length?`Found ${W.found.length===1?"qBittorrent":W.found.length+" qBittorrent servers"}. Pick one, or enter another address.`
      : "No qBittorrent found automatically. Enter the address of its Web UI, as seen from the qBit Lite container."}</p>
    ${W.found===null?`<div class="scan"><div class="spinner"></div>Scanning…</div>`:""}
    ${(W.found||[]).map(f=>`<label class="opt ${!W.manual&&W.url===f.url?"on":""}"><input type="radio" name="qb" ${!W.manual&&W.url===f.url?"checked":""} onchange="pickFound('${jsq(f.url)}')"><div><b>${esc(f.label)}</b><span>${esc(f.url)} · ${f.version?esc(f.version)+" · no login needed":"login required"}</span></div></label>`).join("")}
    ${W.found&&W.found.length?`<label class="opt ${W.manual?"on":""}"><input type="radio" name="qb" ${W.manual?"checked":""} onchange="W.manual=true;W.err='';renderSetup();$('#wUrl').focus()"><div><b>Another address</b><span>Enter it yourself</span></div></label>`:""}
    <form onsubmit="event.preventDefault();setupTest()">
      <div ${W.manual?"":`style="display:none"`}><div class="field"><label class="l">Web UI address</label>
        <input type="text" id="wUrl" value="${esc(W.url)}" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url" placeholder="http://192.168.1.10:8080"></div>
      <ul class="tips">
        <li>Same machine, qBittorrent with host networking: <code>http://host.docker.internal:8080</code></li>
        <li>qBittorrent in another container on the same network: <code>http://qbittorrent:8080</code></li>
        <li>Another computer: <code>http://its-ip:8080</code></li>
        <li>The Web UI must be on: qBittorrent → Options → Web UI.</li>
      </ul></div>
      ${err}
      <div class="nav">${W.found!==null?`<button type="button" class="btn ghost" onclick="scanQbit()">Scan again</button>`:""}<button class="btn" ${busy||(W.found===null&&!W.manual)?"disabled":""}>${W.busy?"Checking…":"Continue"}</button></div>
    </form>`;
  else if(W.step===2) body = `
    <h1>Sign in to qBittorrent</h1>
    <p class="sub">Use your qBittorrent Web UI account. It's used to set up access and is only stored if you choose so in the next step.</p>
    <div class="ok"><svg class="i"><use href="#i-check"/></svg>Found qBittorrent at ${esc(W.url)}</div>
    <form onsubmit="event.preventDefault();setupLogin()">
      <div class="field"><label class="l">Username</label><input type="text" id="wUser" value="${esc(W.user)}" autocomplete="username" autocapitalize="off" required></div>
      <div class="field"><label class="l">Password</label><input type="password" id="wPass" value="${esc(W.pass)}" autocomplete="current-password" required></div>
      ${err}
      <div class="nav"><button type="button" class="btn ghost" onclick="W.step=1;W.err='';renderSetup()">Back</button><button class="btn" ${busy}>${W.busy?"Signing in…":"Continue"}</button></div>
    </form>`;
  else if(W.step===3 && W.open) body = `
    <h1>Almost done</h1>
    <p class="sub">qBittorrent ${esc(W.version)} lets qBit Lite in without a login already, so there's nothing else to set up.</p>
    <div class="ok"><svg class="i"><use href="#i-check"/></svg>Connected to ${esc(W.url)}</div>
    <p class="hint">Anyone who can open qBit Lite can control qBittorrent. Keep it on your local network.</p>
    ${err}
    <div class="nav"><button class="btn ghost" onclick="W.step=1;W.open=false;W.err='';renderSetup()">Back</button><button class="btn" ${busy} onclick="setupFinish()">${W.busy?"Saving…":"Finish"}</button></div>`;
  else if(W.step===3){
    const opt = (m,title,desc,tag) => `<label class="opt ${W.mode===m?"on":""}"><input type="radio" name="mode" ${W.mode===m?"checked":""} onchange="W.mode='${m}';W.err='';renderSetup()"><div><b>${title}${tag?`<em class="tag">${tag}</em>`:""}</b><span>${desc}</span></div></label>`;
    body = `
    <h1>How should qBit Lite sign in?</h1>
    <p class="sub">Choose what happens when someone opens qBit Lite.</p>
    ${opt("bypass","No login","qBit Lite adds its own network to qBittorrent's “Bypass authentication” whitelist. Your password isn't stored anywhere.","Recommended")}
    ${W.mode==="bypass"?`<details class="adv" ${W.err&&W.subnetTried?"open":""}><summary>Network to whitelist: <code>${esc(W.subnet||"?")}</code></summary>
      <input type="text" id="wSubnet" value="${esc(W.subnet)}" autocapitalize="off" spellcheck="false" oninput="W.subnet=this.value.trim()">
      <div class="hint">Detected automatically. Change it only if qBittorrent sees qBit Lite from another address.</div></details>`:""}
    ${opt("credentials","Remember my account","qBit Lite stores your qBittorrent username and password in its config volume and signs in by itself.")}
    ${opt("login","Ask for a login","Every browser signs in with the qBittorrent account, like qBittorrent's own Web UI.")}
    ${W.mode!=="login"?`<p class="hint">With the first two, anyone who can open qBit Lite can control qBittorrent. Keep it on your local network.</p>`:""}
    ${err}
    <div class="nav"><button class="btn ghost" onclick="W.step=2;W.err='';renderSetup()">Back</button><button class="btn" ${busy} onclick="setupFinish()">${W.busy?"Saving…":"Finish"}</button></div>`;
  }
  else body = `
    <div class="bigcheck"><svg><use href="#i-check"/></svg></div>
    <h1>You're all set</h1>
    <p class="sub">${W.mode==="login"?"qBit Lite is connected. You'll sign in with your qBittorrent account."
      : W.mode==="credentials"?"qBit Lite is connected and signs in to qBittorrent by itself."
      : "qBit Lite is connected, no login needed."}</p>
    <p class="hint">You can change this later from the ⚙︎ Settings button.</p>
    <div class="nav"><button class="btn" onclick="boot()">Open qBit Lite</button></div>`;
  $("#app").innerHTML = `<div class="setup"><div class="wiz"><div class="logo"><img src="icon.svg" alt="">qBit Lite</div>${W.step<4?dots:""}${body}</div></div>`;
  if(W.step===2 && !W.busy) (W.user ? $("#wPass") : $("#wUser")).focus();
}
async function setupTest(){
  W.url = $("#wUrl").value.trim().replace(/\/+$/,"");
  if(W.url && !/^https?:\/\//i.test(W.url)) W.url = "http://"+W.url;
  W.busy=true; W.err=""; renderSetup();
  const r = await setupCall("test", {url:W.url});
  W.busy=false;
  if(!r.ok){ W.err = r.error; return renderSetup(); }
  W.subnet = r.subnet||""; W.open = r.open; W.version = r.version||"";
  W.step = r.open ? 3 : 2; renderSetup();
}
async function setupLogin(){
  W.user=$("#wUser").value; W.pass=$("#wPass").value;
  W.busy=true; W.err=""; renderSetup();
  const r = await setupCall("login", {url:W.url, username:W.user, password:W.pass});
  W.busy=false;
  if(!r.ok){ W.err=r.error; return renderSetup(); }
  if(r.subnet) W.subnet=r.subnet;
  W.step=3; renderSetup();
}
async function setupFinish(){
  W.busy=true; W.err=""; W.subnetTried = W.mode==="bypass"; renderSetup();
  const r = await setupCall("finish", {url:W.url, mode:W.open?"open":W.mode, username:W.user, password:W.pass, subnet:W.subnet});
  W.busy=false;
  if(!r.ok){ W.err=r.error; return renderSetup(); }
  if(W.open) W.mode="bypass";
  W.pass=""; W.step=4; renderSetup();
}
async function rerunSetup(skipConfirm){
  if(!skipConfirm && !confirm("Disconnect qBit Lite and run the setup again? Torrents and qBittorrent's settings aren't touched.")) return;
  const r = await setupCall("reset", {});
  if(!r.ok) return toast(r.error||"Couldn't reset", true);
  closeSettings(); W.url = S.cfg.url; S.torrents={}; S.rid=0; boot();
}

/* ============ settings ============ */
function openSettings(){
  $("#setBody").innerHTML = `<div id="setSpeed"><div class="scan"><div class="spinner"></div>Loading…</div></div>
    <h3 class="sect">Connection</h3><div id="setConn"></div>`;
  renderConn();
  $("#setOv").classList.add("show");
  loadSpeed();
  if(!S.appVersion) q("app/version").then(v=>{ S.appVersion=String(v).trim(); if($("#setConn")) renderConn(); }).catch(()=>{});
}
function renderConn(){
  const c=S.cfg, modes={bypass:"No login (whitelisted network)", credentials:"Saved qBittorrent account", login:"Each browser signs in"};
  $("#setConn").innerHTML = `

/* ============ polling ============ */
async function poll(){
  clearTimeout(S.timer);
  try{
    const d = await q("sync/maindata?rid="+S.rid);
    if(d.full_update){ S.torrents={}; S.categories={}; }
    for(const [h,t] of Object.entries(d.torrents||{})) S.torrents[h] = Object.assign(S.torrents[h]||{hash:h}, t);
    for(const h of d.torrents_removed||[]) delete S.torrents[h];
    if(d.categories) for(const [k,v] of Object.entries(d.categories)) S.categories[k] = Object.assign(S.categories[k]||{}, v);
    for(const c of d.categories_removed||[]) delete S.categories[c];
    if(d.server_state) Object.assign(S.server, d.server_state);
    S.rid = d.rid;
    await pollMoves();
    S.busySince = 0; setBusy(false);
    renderTop(); renderList();
    if(S.detail) renderDetails();
  }catch(e){
    if(e instanceof AuthError) return renderLogin("Your session expired. Please sign in again.");
    setBusy(true, e);
  }
  const moving = Object.values(S.torrents).some(t=>t.state==="moving");
  S.timer = setTimeout(poll, document.hidden ? 10000 : moving ? 1000 : 2000);
}
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && $(".top")) poll(); });
/* qBittorrent can stop answering for minutes while it copies a large move
   between disks. Keep the last list on screen and say what's going on. */
function setBusy(on, e){
  S.busy = on;
  const b = $("#busy"); if(!b) return;
  if(!on){ b.hidden = true; return; }
  const since = S.busySince = S.busySince || Date.now();
  const mins = Math.floor((Date.now()-since)/60000);
  const moving = Object.values(S.torrents).some(t=>t.state==="moving");
  b.hidden = false;
  b.innerHTML = `<b>${e && e.status===502 ? "Can't reach qBittorrent" : "qBittorrent isn't responding"}</b>${mins?` · ${mins} min`:""}<br>`
    + (moving ? "It's probably busy copying the moved files between disks. The list will update when it's done."
              : "It may be busy or restarting. Retrying…");
}

/* qBittorrent doesn't report move progress; the server measures the files that
   already reached the destination folder. */
S.moves = {};
async function pollMoves(){
  const hs = Object.values(S.torrents).filter(t=>t.state==="moving").map(t=>t.hash);
  for(const h in S.moves) if(!hs.includes(h)) delete S.moves[h];
  if(!hs.length) return;
  try{
    const r = await fetch("/lite/moves?hashes="+hs.join(","), {credentials:"same-origin"}).then(r=>r.json());
    const now = Date.now();
    for(const h of hs){
      const m = r[h]; if(!m) continue;
      const prev = S.moves[h];
      if(prev && prev.known && m.known && now>prev.t){
        const inst = Math.max(0, (m.done-prev.done)/((now-prev.t)/1000));
        m.speed = prev.speed ? prev.speed*0.6 + inst*0.4 : inst;
      }
      m.t = now; S.moves[h] = m;
    }
  }catch(e){}
}
function moveInfo(t){
  if(t.state!=="moving") return null;
  const m = S.moves[t.hash];
  if(!m || !m.known) return {pct:null, text:"Moving…"};
  const pct = Math.min(100, m.progress*100);
  const left = m.speed>0 ? (m.total-m.done)/m.speed : null;
  return {pct, text:`Moving ${pct.toFixed(0)}% · ${size(m.done)} / ${size(m.total)}${m.speed>0?` · ${speed(m.speed)}`:""}${left!=null?` · ${eta(Math.round(left))} left`:""}`};
}

          <span class="dl">${p.dl_speed>0?"↓ "+speed(p.dl_speed):""}</span><span class="up">${p.up_speed>0?"↑ "+speed(p.up_speed):""}</span></div>

    <div class="actions">
      ${stopped?`<button class="btn" onclick="act('${t.hash}','start')"><svg class="i"><use href="#i-play"/></svg>Start</button>`
               :`<button class="btn ghost" onclick="act('${t.hash}','stop')"><svg class="i"><use href="#i-pause"/></svg>Stop</button>`}
      <button class="btn ghost" onclick="act('${t.hash}','reannounce')">Reannounce</button>
      <button class="btn ghost" onclick="act('${t.hash}','recheck')">Force recheck</button>
      <button class="btn danger" onclick="del('${t.hash}',false)">Remove</button>
      <button class="btn danger" style="grid-column:1/-1" onclick="del('${t.hash}',true)">Delete with files</button>
    </div>` + tabs + `
    <dl class="kv">
      <dt>Size</dt><dd>${size(t.completed)} / ${size(t.size)}</dd>
      <dt>Down</dt><dd class="dl">${speed(t.dlspeed)} · total ${size(t.downloaded)}</dd>
      <dt>Up</dt><dd class="up">${speed(t.upspeed)} · total ${size(t.uploaded)}</dd>
      <dt>ETA</dt><dd>${t.progress<1?eta(t.eta):"–"}</dd>
      <dt>Ratio</dt><dd>${(+t.ratio).toFixed(3)}</dd>
      <dt>Seeds</dt><dd>${t.num_seeds} connected · ${t.num_complete<0?"?":t.num_complete} in swarm</dd>
      <dt>Peers</dt><dd>${t.num_leechs} connected · ${t.num_incomplete<0?"?":t.num_incomplete} in swarm</dd>
      <dt>Download</dt><dd>${dlRoute(t)}</dd>
      <dt>Save path</dt><dd>${esc(t.save_path)}</dd>
      ${t.category?`<dt>Category</dt><dd>${esc(t.category)}</dd>`:""}
      <dt>Added</dt><dd>${ago(t.added_on)}</dd>
      ${t.completion_on>0?`<dt>Completed</dt><dd>${ago(t.completion_on)}</dd>`:""}
      <dt>Tracker</dt><dd>${esc(t.tracker||"–")}</dd>
      <dt>Hash</dt><dd style="font-family:ui-monospace,Menlo,monospace;font-size:12px">${t.hash}</dd>
    </dl>`;
  body.scrollTop=scroll;
}

/* ============ add ============ */
const add = { files:[], savepath:"", useInc:false, incpath:"", category:"", stopped:false };
function recentPaths(){
  const count={};
  for(const t of Object.values(S.torrents)) if(t.save_path) count[t.save_path]=(count[t.save_path]||0)+1;
  const def = S.prefs?.save_path;
  const list = Object.entries(count).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  if(def) list.unshift(def);
  return [...new Set(list.map(p=>p.replace(/\/+$/,"")||"/"))].slice(0,8);
}
function openAdd(){
  const last = JSON.parse(localStorage.getItem("ql.add")||"{}");
  add.files=[];
  add.savepath = (last.savepath || S.prefs?.save_path || "").replace(/\/+$/,"");
  add.useInc = last.useInc ?? !!S.prefs?.temp_path_enabled;
  add.incpath = (last.incpath || S.prefs?.temp_path || "").replace(/\/+$/,"");
  add.category = last.category || "";
  add.stopped = !!last.stopped;
  dirs.cache = {};
  renderAdd();
  $("#addOv").classList.add("show");
}
function closeAdd(){ $("#addOv").classList.remove("show"); }

/* Drag .torrent files from Finder/Explorer anywhere onto the page to add them. */
(()=>{
  let depth=0;
  const isFiles = e => [...(e.dataTransfer?.types||[])].includes("Files");
  const ready = () => !!$(".top");          // main UI only, not setup/login
  const show = on => $("#dropOv").classList.toggle("show", on);
  addEventListener("dragenter", e=>{ if(!isFiles(e)||!ready()) return; e.preventDefault(); depth++; show(true); });
  addEventListener("dragover", e=>{ if(!isFiles(e)||!ready()) return; e.preventDefault(); e.dataTransfer.dropEffect="copy"; });
  addEventListener("dragleave", e=>{ if(!isFiles(e)) return; if(--depth<=0){ depth=0; show(false); } });
  addEventListener("drop", e=>{
    if(!isFiles(e)) return;
    e.preventDefault(); depth=0; show(false);
    if(!ready()) return;
    const files=[...e.dataTransfer.files];
    if(!files.some(f=>/\.torrent$/i.test(f.name))) return toast("That isn't a .torrent file", true);
    if(!$("#addOv").classList.contains("show")) openAdd();
    takeFiles(files);
  });
})();

/* ---------- folder browser: drill down one level at a time (lists folders through
   qBittorrent, so paths are exactly what qBittorrent sees) ---------- */
const dirs = { cache:{} };
function dirRoot(key){
  const p = key==="savepath" ? (S.prefs?.save_path||"/media") : (S.prefs?.temp_path||"/incomplete");
  return "/"+(p.split("/").filter(Boolean)[0]||"");
}
async function listDir(path){
  if(Array.isArray(dirs.cache[path])) return dirs.cache[path];
  try{
    const r = await q("app/getDirectoryContent?dirPath="+encodeURIComponent(path)+"&mode=dirs");
    dirs.cache[path] = (Array.isArray(r)?r:[]).filter(x=>!x.split("/").pop().startsWith("."))
      .sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base",numeric:true}));
  }catch(e){ dirs.cache[path]=[]; }
  return dirs.cache[path];
}
function curDir(key){
  const root=dirRoot(key); let p=(add[key]||"").replace(/\/+$/,"");
  return (p===root || p.startsWith(root+"/")) ? p : root;
}
async function goDir(key, path){
  add[key]=path; drawBrowser(key);
  const el=$("#dirs-"+key); if(el) el.scrollTop=0;
  await listDir(path); drawBrowser(key);
}
function drawBrowser(key){
  const box=$("#br-"+key); if(!box) return;
  const root=dirRoot(key), cur=curDir(key);
  const segs=cur.slice(root.length).split("/").filter(Boolean);
  let acc=root;
  const crumbs=[`<button type="button" onclick="goDir('${key}','${jsq(root)}')">${esc(root.slice(1))}</button>`]
    .concat(segs.map(s=>{ acc+="/"+s; return `<span class="sep">›</span><button type="button" onclick="goDir('${key}','${jsq(acc)}')">${esc(s)}</button>`; }));
  const kids=dirs.cache[cur];
  const up = cur!==root ? cur.slice(0,cur.lastIndexOf("/")) : null;
  let list;
  if(!Array.isArray(kids)){ list=`<div class="dirmsg">Loading…</div>`; listDir(cur).then(()=>drawBrowser(key)); }
  else list = (up?`<button type="button" class="dir up" onclick="goDir('${key}','${jsq(up)}')"><svg class="i"><use href="#i-back"/></svg><span>Back</span></button>`:"")
    + (kids.length ? kids.map(k=>`<button type="button" class="dir" onclick="goDir('${key}','${jsq(k)}')"><svg class="i fold"><use href="#i-folder"/></svg><span>${esc(k.split("/").pop())}</span><svg class="i chev"><use href="#i-chev"/></svg></button>`).join("")
                   : `<div class="dirmsg">No subfolders. Files will be saved right here.</div>`);
  box.innerHTML = `
    <div class="savehere"><svg class="i"><use href="#i-folder"/></svg><span>${esc(cur)}</span></div>
    <div class="crumbs" id="cr-${key}">${crumbs.join("")}</div>
    <div class="dirs" id="dirs-${key}">${list}</div>
    <button type="button" class="newdir" onclick="newFolder('${key}')">+ New folder here</button>`;
  const cr=$("#cr-"+key); if(cr) cr.scrollLeft=cr.scrollWidth;
  document.querySelectorAll(".pchip").forEach(c=>c.classList.toggle("on", c.dataset.p===add.savepath));
}
function newFolder(key){
  const name = prompt("New folder name (qBittorrent creates it when the download starts):");
  if(!name || !name.trim()) return;
  const cur=curDir(key), path=cur+"/"+name.trim().replace(/[\/\\]+/g," ");
  dirs.cache[path]=[]; (dirs.cache[cur]||=[]).push(path);
  goDir(key, path);
}
function renderAdd(){
  const cats = Object.keys(S.categories).sort();
  $("#addBody").innerHTML = `
    <div class="field"><label class="drop ${add.files.length?"has":""}"><input type="file" multiple onchange="pickFiles(this)">
      <svg class="i" style="width:26px;height:26px;margin-bottom:4px"><use href="#i-plus"/></svg><br>
      ${add.files.length ? add.files.map(f=>esc(f.name)).join("<br>") : "Choose .torrent files<span class=\"draghint\"><br>or drag them onto the page</span>"}</label></div>
    <div class="field"><label class="l">Save to</label>
      <div class="browser" id="br-savepath"></div>
      ${recentPaths().length?`<div class="hint" style="margin-top:10px">Recent</div><div class="chips" style="margin-top:6px">${recentPaths().map(p=>`<button type="button" class="pchip ${p===add.savepath?"on":""}" data-p="${esc(p)}" onclick="goDir('savepath','${jsq(p)}')">${esc(p)}</button>`).join("")}</div>`:""}</div>
    <div class="field"><label class="l">Download</label>
      <label class="opt ${add.useInc?"on":""}"><input type="radio" name="dlto" ${add.useInc?"checked":""} onchange="setUseInc(true)"><div><b>To the incomplete folder first</b><span>${add.incpath?`<code>${esc(curDir("incpath")||add.incpath)}</code> · `:""}moved to “Save to” when finished</span></div></label>
      <label class="opt ${add.useInc?"":"on"}"><input type="radio" name="dlto" ${add.useInc?"":"checked"} onchange="setUseInc(false)"><div><b>Directly to “Save to”</b><span>No move at the end</span></div></label>
      ${add.useInc?`<div class="browser" id="br-incpath"></div>`:""}</div>
    ${cats.length?`<div class="field"><label class="l">Category</label><select onchange="add.category=this.value"><option value="">None</option>${cats.map(c=>`<option ${c===add.category?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`:""}
    <div class="field rowtoggle"><label class="l" style="margin:0">Add stopped</label>
      <label class="toggle"><input type="checkbox" ${add.stopped?"checked":""} onchange="add.stopped=this.checked"><span class="sw"></span></label></div>`;
  drawBrowser("savepath"); drawBrowser("incpath");
}
/* No "accept" filter on the input: iOS greys out .torrent files (no system type for
   them) and Android pickers hide them (they come as application/octet-stream).
   Check the files here instead. */
function setUseInc(on){ add.useInc=on; const st=$("#addBody").scrollTop; renderAdd(); $("#addBody").scrollTop=st; }
function pickFiles(inp){ takeFiles([...inp.files]); }
function takeFiles(all){
  const ok=all.filter(f=>/\.torrent$/i.test(f.name));
  if(all.length && !ok.length) toast("That isn't a .torrent file", true);
  else if(ok.length<all.length) toast(`Skipped ${all.length-ok.length} file(s) that aren't .torrent`, true);
  if(ok.length) add.files=ok;
  const st=$("#addBody").scrollTop; renderAdd(); $("#addBody").scrollTop=st;
}
async function submitAdd(){
  if(!add.files.length) return toast("Choose a .torrent file", true);
  const save=curDir("savepath"), inc=curDir("incpath");
  const fd = new FormData();
  for(const f of add.files) fd.append("torrents", f, f.name);
  fd.append("savepath", save);
  fd.append("autoTMM","false");
  if(add.useInc){ fd.append("useDownloadPath","true"); fd.append("downloadPath", inc); }
  else fd.append("useDownloadPath","false");
  if(add.category) fd.append("category", add.category);
  fd.append("stopped", add.stopped?"true":"false"); fd.append("paused", add.stopped?"true":"false");
  $("#addGo").disabled=true;
  try{
    const r = await q("torrents/add", {method:"POST", body:fd});
    // qBittorrent < 5.2 answers "Ok." / "Fails.", newer versions a JSON summary.
    if(String(r).trim()==="Fails." || (r && r.failure_count>0 && !r.success_count && !r.pending_count))
      throw new Error("qBittorrent rejected the torrent (invalid or already added)");
    localStorage.setItem("ql.add", JSON.stringify({savepath:save, useInc:add.useInc, incpath:inc, category:add.category, stopped:add.stopped}));
    const n = add.files.length;
    toast(`Added ${n} torrent${n>1?"s":""}`); closeAdd(); S.rid=0; poll();
  }catch(e){ if(e instanceof AuthError) return renderLogin("Your session expired. Please sign in again."); toast(e.message,true); }
  $("#addGo").disabled=false;
}

boot();
</script>
